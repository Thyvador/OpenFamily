name: Docker Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nexaflowfrance/openfamily
  ARM64_IMAGE_PREFIX: ghcr.io/Thyvador/openfamilly-arm64

jobs:
  publish:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-client:latest
            ${{ env.IMAGE_PREFIX }}-client:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-server:latest
            ${{ env.IMAGE_PREFIX }}-server:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push ARM64 client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ARM64_IMAGE_PREFIX }}-client:latest
            ${{ env.ARM64_IMAGE_PREFIX }}-client:${{ steps.version.outputs.VERSION }}
          build-args: |
            VITE_API_URL=
            VITE_WS_URL=
            VITE_REGISTRATION_ENABLED=true
          cache-from: type=gha,scope=openfamily-arm64-client
          cache-to: type=gha,mode=max,scope=openfamily-arm64-client

      - name: Build & push ARM64 server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ARM64_IMAGE_PREFIX }}-server:latest
            ${{ env.ARM64_IMAGE_PREFIX }}-server:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha,scope=openfamily-arm64-server
          cache-to: type=gha,mode=max,scope=openfamily-arm64-server
